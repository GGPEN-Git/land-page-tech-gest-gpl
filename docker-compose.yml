services:
  postgres:
    image: postgres:16-alpine
    container_name: techgest-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: techgest
      POSTGRES_PASSWORD: techgest_local
      POSTGRES_DB: techgest

    ports:
      # Porta 5433 no anfitrião para não chocar com um Postgres já instalado na 5432.
      - "5433:5432"

    volumes:
      - dados-postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techgest -d techgest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados-postgres:
