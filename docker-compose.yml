services:
  postgres:
    # postgres:16 e não a variante alpine: a imagem alpine descarregada nesta
    # máquina é de outra arquitetura e devolve "exec format error".
    image: postgres:16
    container_name: techgest-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: techgest
      POSTGRES_PASSWORD: techgest_local
      POSTGRES_DB: techgest

    ports:
      # 5432, 5433 e 5434 já estão ocupadas por outros projetos nesta máquina
      # (nextjs_postgres, techagro-db e conselho_crianca_db).
      - "5435:5432"

    volumes:
      - dados-postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techgest -d techgest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados-postgres:
