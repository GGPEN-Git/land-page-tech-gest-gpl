name: Deploy para GitHub Pages

on:
  push:
    branches: [master]
  # Permite lançar o deploy à mão no separador Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy de cada vez; um push novo cancela o anterior ainda a correr.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Compilar
        run: npm run build
        env:
          # Tem de coincidir com o nome do repositório, com barras a abrir e a fechar.
          BASE_PATH: /land-page-tech-gest-gpl/

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Enviar o artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no Pages
        id: deployment
        uses: actions/deploy-pages@v4
