services:
  - type: web
    name: land-page-tech-gest-gpl
    runtime: node
    region: frankfurt

    # --include=dev é obrigatório: o Render define NODE_ENV=production, e sem esta
    # flag o npm salta as devDependencies — ficaria sem vite nem typescript e o build falhava.
    buildCommand: npm ci --include=dev && npx tsc --noEmit && npm run build
    startCommand: node server.js

    healthCheckPath: /healthz

    envVars:
      - key: NODE_VERSION
        value: "20"
