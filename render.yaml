services:
  - type: web
    name: land-page-tech-gest-gpl
    runtime: node
    region: frankfurt

    # --include=dev é obrigatório: o Render define NODE_ENV=production, e sem esta
    # flag o npm salta as devDependencies — ficaria sem vite nem typescript.
    # A migração corre aqui: é idempotente, pode repetir-se em cada deploy.
    # db:semear usa "on conflict do nothing": correr em cada deploy não mexe
    # nas contas existentes nem repõe palavras-passe.
    buildCommand: npm ci --include=dev && npx tsc --noEmit && npm run build && npm run db:migrar && npm run db:semear
    startCommand: node server.js

    healthCheckPath: /healthz

    envVars:
      - key: NODE_VERSION
        value: "20"
      # Explícito e não herdado: decide o TLS do Postgres e a flag secure do cookie.
      - key: NODE_ENV
        value: production
      # sync: false = definida no painel do Render, nunca neste ficheiro.
      # É a connection string do Supabase e contém a senha da base de dados.
      - key: DATABASE_URL
        sync: false
      - key: SESSAO_DIAS
        value: "7"
      # Contas iniciais. Definidas no painel para não ficarem no repositório
      # nem serem impressas no log do build.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SENHA
        sync: false
      - key: UTILIZADOR_EMAIL
        sync: false
      - key: UTILIZADOR_SENHA
        sync: false
